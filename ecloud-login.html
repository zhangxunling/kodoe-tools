        .btn-danger {

<body>
    <!-- 登录遮罩 -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>访问验证</h2>
            <p class="subtitle" id="login-subtitle">请输入用户名和密码</p>

            <input type="password" id="access-password" placeholder="密码" autocomplete="off">

    </div>
    
    <div class="container">
        <h1>☁️ 七牛云存储 Ecloud 聚合平台</h1>
        <p class="subtitle" id="cluster-count">共 0 个集群</p>
        
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openAddModal()">+ 添加集群</button>
            <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
            <button class="btn btn-secondary" onclick="importData()">导入数据</button>
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        </div>
        
        <div id="cluster-container">
            <!-- 按区域分组的集群列表 -->
        </div>
        
        <div class="empty-state" id="empty-state" style="display: none;">
            <h3>暂无集群</h3>
            <p>点击上方"添加集群"按钮开始</p>
        </div>
        
        <div class="footer">
            <p>数据保存在本地浏览器 · 可导出备份</p>
        </div>
    </div>

    <!-- 添加/编辑集群模态框 -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">添加集群</h2>
            <form id="cluster-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>区域 *</label>
                    <input type="text" id="cluster-region" placeholder="例如：北京、上海、广州" required list="region-list">
                    <datalist id="region-list"></datalist>
                </div>
                <div class="form-group">
                    <label>集群名称 *</label>
                    <input type="text" id="cluster-name" placeholder="例如：生产环境" required>
                </div>
                <div class="form-group">
                    <label>集群ID</label>
                    <input type="text" id="cluster-id" placeholder="例如：BJ-PROD-01">
                </div>
                <div class="form-group">
                    <label>登录地址 *</label>
                    <input type="url" id="cluster-url" placeholder="https://cluster.example.com" required>
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="cluster-username" placeholder="登录用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="cluster-password" placeholder="登录密码">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="cluster-note" placeholder="其他说明">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

    <script>
        const STORAGE_KEY = 'ecloud-clusters';
        const COLLAPSED_KEY = 'ecloud-collapsed-regions';
        const SESSION_KEY = 'ecloud-session';
        
        // 数据文件路径
        const DATA_URL = './data/clusters.json';
        
        // 内存中的数据缓存
        let clustersCache = [];
        
        // 纯 JavaScript SHA-256 实现（兼容非 HTTPS 环境）
        async function sha256(message) {
            // 优先使用 Web Crypto API（HTTPS 环境下可用）
            if (typeof crypto !== 'undefined' && crypto.subtle) {
                try {
                    const msgBuffer = new TextEncoder().encode(message);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (e) {
                    console.warn('Web Crypto API 不可用，使用纯 JS 实现');
                }
            }
            
            // 纯 JavaScript SHA-256 备用实现
            const K = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));
            const ch = (x, y, z) => (x & y) ^ (~x & z);
            const maj = (x, y, z) => (x & y) ^ (x & z) ^ (y & z);
            const sigma0 = (x) => rotr(x, 2) ^ rotr(x, 13) ^ rotr(x, 22);
            const sigma1 = (x) => rotr(x, 6) ^ rotr(x, 11) ^ rotr(x, 25);
            const gamma0 = (x) => rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
            const gamma1 = (x) => rotr(x, 17) ^ rotr(x, 19) ^ (x >>> 10);
            
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const msgLen = data.length;
            const bitLen = msgLen * 8;
            
            // Padding
            const paddingLen = (msgLen % 64 < 56) ? (56 - msgLen % 64 - 1) : (120 - msgLen % 64 - 1);
            const padded = new Uint8Array(msgLen + paddingLen + 9);
            padded.set(data);
            padded[msgLen] = 0x80;
            const view = new DataView(padded.buffer);
            view.setUint32(msgLen + paddingLen + 1, 0, false);
            view.setUint32(msgLen + paddingLen + 5, bitLen, false);
            
            // Initial hash values
            let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
            let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
            
            const w = new Uint32Array(64);
            
            for (let i = 0; i < padded.length; i += 64) {
                const chunk = new DataView(padded.buffer, i, 64);
                for (let j = 0; j < 16; j++) {
                    w[j] = chunk.getUint32(j * 4, false);
                }
                for (let j = 16; j < 64; j++) {
                    w[j] = (gamma1(w[j-2]) + w[j-7] + gamma0(w[j-15]) + w[j-16]) >>> 0;
                }
                
                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                
                for (let j = 0; j < 64; j++) {
                    const t1 = (h + sigma1(e) + ch(e, f, g) + K[j] + w[j]) >>> 0;
                    const t2 = (sigma0(a) + maj(a, b, c)) >>> 0;
                    h = g; g = f; f = e; e = (d + t1) >>> 0;
                    d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                }
                
                h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
            }
            
            return [h0, h1, h2, h3, h4, h5, h6, h7].map(x => x.toString(16).padStart(8, '0')).join('');
        }
        
        // 从服务器加载集群数据
        async function loadClustersFromServer() {
            try {
                const response = await fetch(DATA_URL, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    clustersCache = await response.json();
                } else {
                    clustersCache = [];
                }
            } catch (e) {
                console.error('加载集群数据失败:', e);
                // 如果服务器加载失败，尝试从 localStorage 读取
                const data = localStorage.getItem(STORAGE_KEY);
                clustersCache = data ? JSON.parse(data) : [];
            }
            return clustersCache;
        }
        
        // 保存集群数据到服务器
        async function saveClustersToServer(clusters) {
            try {
                const response = await fetch(DATA_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clusters, null, 2)
                });
                if (response.ok) {
                    clustersCache = clusters;
                    return true;
                } else {
                    console.error('保存失败:', response.status);
                    return false;
                }
            } catch (e) {
                console.error('保存集群数据失败:', e);
                // 保存到 localStorage 作为备份
                localStorage.setItem(STORAGE_KEY, JSON.stringify(clusters));
                clustersCache = clusters;
                return true;
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkAccess();
        });
        
        // 硬编码的用户名和密码哈希
        const HARDCODED_USERNAME = 'admin';
        const HARDCODED_PASSWORD_HASH = 'e030e6348736baba7afc7cdbf1d11601434682c4b62bdf2e139cd00957a0d3df';
        
        // 检查访问权限
        async function checkAccess() {
            const session = sessionStorage.getItem(SESSION_KEY);
            if (session === 'authenticated') {
                hideLoginOverlay();
                await loadClustersFromServer();
                renderClusters();
                return;
            }
            
            // 显示登录界面
            document.getElementById('login-subtitle').textContent = '请输入用户名和密码';
            document.getElementById('login-overlay').classList.remove('hidden');
        }
        
        // 验证用户名和密码
        async function verifyPassword() {
            try {
                const usernameInput = document.getElementById('access-username');
                const passwordInput = document.getElementById('access-password');
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                const errorEl = document.getElementById('login-error');
                
                if (!username) {
                    errorEl.textContent = '请输入用户名';
                    errorEl.classList.add('show');
                    usernameInput.focus();
                    return;
                }
                
                if (!password) {
                    errorEl.textContent = '请输入密码';
                    errorEl.classList.add('show');
                    passwordInput.focus();
                    return;
                }
                
                // 计算输入密码的哈希
                const passwordHash = await sha256(password);
                
                // 验证用户名和密码
                if (username === HARDCODED_USERNAME && passwordHash === HARDCODED_PASSWORD_HASH) {
                    sessionStorage.setItem(SESSION_KEY, 'authenticated');
                    hideLoginOverlay();
                    await loadClustersFromServer();
                    renderClusters();
                } else {
                    errorEl.textContent = '用户名或密码错误，请重试';
                    errorEl.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (e) {
                console.error('验证过程出错:', e);
                alert('验证过程出错: ' + e.message);
            }
        }
        
        // 隐藏登录遮罩
        function hideLoginOverlay() {
            document.getElementById('login-overlay').classList.add('hidden');
        }
        
        // 退出登录
        function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            
            // 清除会话
            sessionStorage.removeItem(SESSION_KEY);
            
            // 重置登录表单
            document.getElementById('access-username').value = '';
            document.getElementById('access-password').value = '';
            document.getElementById('login-error').classList.remove('show');
            
            // 显示登录遮罩
            document.getElementById('login-overlay').classList.remove('hidden');
            
            showToast('已退出登录');
        }
        
        // 回车键提交
        document.getElementById('access-username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('access-password').focus();
            }
        });
        document.getElementById('access-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });
        
        // 获取集群数据
        function getClusters() {
            return clustersCache;
        }
        
        // 保存集群数据
        async function saveClusters(clusters) {
            await saveClustersToServer(clusters);
            renderClusters();
        }
        
        // 获取折叠状态
        function getCollapsedRegions() {
            const data = localStorage.getItem(COLLAPSED_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        // 保存折叠状态
        function saveCollapsedRegions(regions) {
            localStorage.setItem(COLLAPSED_KEY, JSON.stringify(regions));
        }
        
        // 切换区域折叠
        function toggleRegion(region) {
            const collapsed = getCollapsedRegions();
            const index = collapsed.indexOf(region);
            if (index === -1) {
                collapsed.push(region);
            } else {
                collapsed.splice(index, 1);
            }
            saveCollapsedRegions(collapsed);
            renderClusters();
        }
        
        // 获取所有区域
        function getRegions() {
            const clusters = getClusters();
            const regions = [...new Set(clusters.map(c => c.region).filter(Boolean))];
            return regions.sort();
        }
        
        // 渲染集群列表
        function renderClusters() {
            const clusters = getClusters();
            const regions = getRegions();
            const collapsed = getCollapsedRegions();
            const container = document.getElementById('cluster-container');
            const emptyState = document.getElementById('empty-state');
            const countEl = document.getElementById('cluster-count');
            
            countEl.textContent = `共 ${clusters.length} 个集群`;
            
            if (clusters.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // 按区域分组
            const grouped = {};
            clusters.forEach(cluster => {
                const region = cluster.region || '未分类';
                if (!grouped[region]) grouped[region] = [];
                grouped[region].push(cluster);
            });
            
            // 排序区域
            const sortedRegions = Object.keys(grouped).sort((a, b) => {
                if (a === '未分类') return 1;
                if (b === '未分类') return -1;
                return a.localeCompare(b, 'zh-CN');
            });
            
            let html = '';
            sortedRegions.forEach(region => {
                const regionClusters = grouped[region];
                const isCollapsed = collapsed.includes(region);
                
                html += `
                    <div class="region-group">
                        <div class="region-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleRegion(${JSON.stringify(region)})">
                            <span class="arrow">▼</span>
                            <span class="region-name">${escapeHtml(region)}</span>
                            <span class="region-count">(${regionClusters.length})</span>
                        </div>
                        <div class="region-clusters ${isCollapsed ? 'collapsed' : ''}">
                            ${regionClusters.map((cluster, index) => `
                                <div class="cluster-card" data-cluster-id="${escapeHtml(cluster.id)}" data-username="${escapeHtml(cluster.username || '')}" data-password="${escapeHtml(cluster.password || '')}">
                                    <div class="cluster-header">
                                        <span class="cluster-id">${escapeHtml(cluster.clusterId || 'CLUSTER-' + (index + 1))}</span>
                                        <div class="header-btns">
                                            <button class="edit-btn" onclick="openEditModal(this.closest('.cluster-card').dataset.clusterId)">编辑</button>
                                            <button class="delete-btn" onclick="deleteCluster(this.closest('.cluster-card').dataset.clusterId)">删除</button>
                                        </div>
                                    </div>
                                    <div class="cluster-info">
                                        <span class="cluster-url">${escapeHtml(cluster.url)}</span>
                                        ${cluster.note ? `<span class="cluster-note">${escapeHtml(cluster.note)}</span>` : ''}
                                    </div>
                                    <div class="cluster-credentials">
                                        ${cluster.username ? `
                                        <div class="cred-item">
                                            <span class="cred-label">用户</span>
                                            <span class="cred-value">${escapeHtml(cluster.username)}</span>
                                            <button class="copy-btn" onclick="copyFromCard(this, 'username')">复制</button>
                                        </div>
                                        ` : ''}
                                        ${cluster.password ? `
                                        <div class="cred-item">
                                            <span class="cred-label">密码</span>
                                            <span class="cred-value pwd-hidden" id="pwd-${cluster.id}">********</span>
                                            <button class="toggle-pwd-btn" onclick="togglePwdFromCard(this)">显示</button>
                                            <button class="copy-btn" onclick="copyFromCard(this, 'password')">复制</button>
                                        </div>
                                        ` : ''}
                                    </div>
                                    <a href="${escapeHtml(cluster.url)}" class="login-btn" target="_blank" rel="noopener noreferrer" onclick="return handleLoginFromCard(this)">登录入口</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // HTML转义
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }
        
        // 转义 HTML 属性值（用于 onclick 等）
        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\')
                      .replace(/'/g, "\\'")
                      .replace(/"/g, '\\"')
                      .replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;');
        }
        
        // 安全的 Base64 编码（支持 Unicode）
        function safeBtoa(str) {
            try {
                return btoa(encodeURIComponent(str || '').replace(/%([0-9A-F]{2})/g, (match, p1) => {
                    return String.fromCharCode('0x' + p1);
                }));
            } catch (e) {
                console.error('Base64 编码失败:', e);
                return '';
            }
        }
        
        // 安全的 Base64 解码（支持 Unicode）
        function safeAtob(base64Str) {
            try {
                return decodeURIComponent(atob(base64Str || '').split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                console.error('Base64 解码失败:', e);
                return '';
            }
        }
        
        // 打开添加模态框
        function openAddModal() {
            document.getElementById('modal-title').textContent = '添加集群';
            document.getElementById('edit-id').value = '';
            document.getElementById('cluster-form').reset();
            document.getElementById('modal-overlay').classList.add('active');
        }
        
        // 打开编辑模态框
        function openEditModal(id) {
            const clusters = getClusters();
            const cluster = clusters.find(c => c.id === id);
            if (!cluster) return;
            
            document.getElementById('modal-title').textContent = '编辑集群';
            document.getElementById('edit-id').value = id;
            document.getElementById('cluster-region').value = cluster.region || '';
            document.getElementById('cluster-name').value = cluster.name;
            document.getElementById('cluster-id').value = cluster.clusterId || '';
            document.getElementById('cluster-url').value = cluster.url;
            document.getElementById('cluster-username').value = cluster.username || '';
            document.getElementById('cluster-password').value = cluster.password || '';
            document.getElementById('cluster-note').value = cluster.note || '';
            document.getElementById('modal-overlay').classList.add('active');
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }
        
        // 表单提交
        document.getElementById('cluster-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const editId = document.getElementById('edit-id').value;
            const cluster = {
                id: editId || Date.now().toString(),
                region: document.getElementById('cluster-region').value.trim(),
                name: document.getElementById('cluster-name').value.trim(),
                clusterId: document.getElementById('cluster-id').value.trim(),
                url: document.getElementById('cluster-url').value.trim(),
                username: document.getElementById('cluster-username').value.trim(),
                password: document.getElementById('cluster-password').value.trim(),
                note: document.getElementById('cluster-note').value.trim()
            };
            
            const clusters = getClusters();
            
            if (editId) {
                const index = clusters.findIndex(c => c.id === editId);
                if (index !== -1) {
                    clusters[index] = cluster;
                }
            } else {
                clusters.push(cluster);
            }
            
            await saveClusters(clusters);
            closeModal();
            showToast(editId ? '集群已更新' : '集群已添加');
        });
        
        // 删除集群
        async function deleteCluster(id) {
            if (!confirm('确定要删除这个集群吗？')) return;
            
            const clusters = getClusters().filter(c => c.id !== id);
            await saveClusters(clusters);
            showToast('集群已删除');
        }
        
        // 复制文本
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败');
            });
        }
        
        // 从卡片 data 属性复制
        function copyFromCard(btn, field) {
            const card = btn.closest('.cluster-card');
            const value = card.dataset[field] || '';
            if (value) {
                copyText(value);
            } else {
                showToast('无内容可复制');
            }
        }
        
        // 切换密码显示/隐藏（从卡片）
        function togglePwdFromCard(btn) {
            const card = btn.closest('.cluster-card');
            const clusterId = card.dataset.clusterId;
            const password = card.dataset.password || '';
            const pwdEl = document.getElementById('pwd-' + clusterId);
            
            if (pwdEl.classList.contains('pwd-hidden')) {
                pwdEl.textContent = password;
                pwdEl.classList.remove('pwd-hidden');
                btn.textContent = '隐藏';
            } else {
                pwdEl.textContent = '********';
                pwdEl.classList.add('pwd-hidden');
                btn.textContent = '显示';
            }
        }
        
        // 处理登录跳转（从卡片）
        function handleLoginFromCard(link) {
            const card = link.closest('.cluster-card');
            const password = card.dataset.password || '';
            const url = link.getAttribute('href');
            
            if (!url || url === 'undefined' || url === 'null') {
                showToast('请先配置登录地址');
                return false;
            }
            
            if (password) {
                navigator.clipboard.writeText(password).then(() => {
                    showToast('密码已复制到剪贴板');
                }).catch(() => {
                    showToast('密码复制失败');
                });
            }
            
            return true;
        }
        
        // 导出数据
        function exportData() {
            const clusters = getClusters();
            const dataStr = JSON.stringify(clusters, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ecloud-clusters-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        }
        
        // 导入数据
        function importData() {
            document.getElementById('import-file').click();
        }
        
        // 处理导入
        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        throw new Error('无效的数据格式');
                    }
                    
                    const existing = getClusters();
                    const merged = [...existing];
                    let addedCount = 0;
                    
                    imported.forEach(cluster => {
                        if (cluster.id && cluster.name && cluster.url) {
                            const exists = merged.find(c => c.id === cluster.id);
                            if (!exists) {
                                merged.push(cluster);
                                addedCount++;
                            }
                        }
                    });
                    
                    await saveClusters(merged);
                    if (addedCount === 0) {
                        showToast('无新集群需要导入（可能已存在）');
                    } else {
                        showToast(`已导入 ${addedCount} 个新集群`);
                    }
                } catch (err) {
                    showToast('导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // 点击模态框外部关闭
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') {
                closeModal();
            }
        });
    </script>
</body>
</html>
